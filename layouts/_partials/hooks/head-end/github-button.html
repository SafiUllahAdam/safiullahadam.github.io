<link rel="stylesheet" href="/css/custom.css">
<script async defer src="https://buttons.github.io/buttons.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var allHeadings = document.querySelectorAll('h1, h2, h3');
  for (var p = 0; p < allHeadings.length; p++) {
    if ((allHeadings[p].textContent || '').trim().toLowerCase() === 'featured publications') {
      var papersSection = allHeadings[p].closest('section') || allHeadings[p].parentElement;
      if (papersSection) {
        papersSection.classList.add('featured-publications-section');
        papersSection.querySelectorAll('article, .article-card, .featured-publication-manual-card').forEach(function (node) {
          node.remove();
        });

        var card = document.createElement('div');
        card.className = 'featured-publication-manual-card';
        card.innerHTML =
          '<img src="/uploads/featured-publication.png" alt="Driver Safety using Human Pose Estimation">' +
          '<div class="featured-publication-manual-body">' +
          '<span class="featured-publication-manual-tag">Computer Vision</span>' +
          '<h3><a href="/publication/driver-safety-icet/">Driver Safety using Human Pose Estimation</a></h3>' +
          '<p>A YOLOv8-based real-time pose estimation pipeline with attention over safety-critical regions for driver fatigue and drowsiness classification on the DriPE dataset.</p>' +
          '<a class="featured-publication-manual-link" href="/publication/driver-safety-icet/">Read publication</a>' +
          '</div>';
        papersSection.appendChild(card);
      }
      break;
    }
  }

  if (window.location.pathname !== '/experience/' && window.location.pathname !== '/experience') return;
  document.body.classList.add('experience-page');

  var headings = allHeadings;
  for (var i = 0; i < headings.length; i++) {
    if ((headings[i].textContent || '').trim().toLowerCase() === 'experience') {
      headings[i].textContent = 'Leadership & Student Support';
      var leadershipSection = headings[i].closest('section') || headings[i].parentElement;
      if (leadershipSection) leadershipSection.classList.add('experience-leadership');
      break;
    }
  }

  for (var j = 0; j < headings.length; j++) {
    if ((headings[j].textContent || '').trim().toLowerCase() === 'education') {
      var parent = headings[j].parentElement;
      var current = headings[j];

      while (current && current.parentElement === parent) {
        var next = current.nextElementSibling;
        current.remove();
        current = next;
      }
      break;
    }
  }

  for (var k = 0; k < headings.length; k++) {
    if ((headings[k].textContent || '').trim().toLowerCase() === 'awards') {
      var awardsSection = headings[k].closest('section') || headings[k].parentElement;
      if (awardsSection) awardsSection.classList.add('experience-awards');
      break;
    }
  }

  for (var l = 0; l < headings.length; l++) {
    if ((headings[l].textContent || '').trim().toLowerCase() === 'skills & hobbies') {
      var skillsSection = headings[l].closest('section') || headings[l].parentElement;
      if (skillsSection) skillsSection.classList.add('experience-skills');
      break;
    }
  }
});
</script>
