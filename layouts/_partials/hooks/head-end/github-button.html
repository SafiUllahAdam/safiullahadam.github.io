<link rel="stylesheet" href="/css/custom.css">
<script async defer src="https://buttons.github.io/buttons.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var allHeadings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
  for (var r = 0; r < allHeadings.length; r++) {
    if ((allHeadings[r].textContent || '').trim().toLowerCase() === 'recent publications') {
      var recentSection = allHeadings[r].closest('section') || allHeadings[r].parentElement;
      if (recentSection) recentSection.classList.add('recent-publications-section');
      break;
    }
  }

  document.querySelectorAll('a[href*="/publications/driver-safety-icet/"]').forEach(function (link) {
    var citation = link.closest('li, article, .citation, .publication-list, .pub-list-item, div') || link.parentElement;
    if (citation) {
      citation.classList.add('recent-publication-citation-centered');
    }
  });

  if (window.location.pathname === '/projects/driver-safety-pose-estimation/' || window.location.pathname === '/projects/driver-safety-pose-estimation') {
    document.querySelectorAll('a[href$="/projects/pose-guided-synthesis/"], a[href$="/projects/pose-guided-synthesis"]').forEach(function (link) {
      link.href = '/projects/driver-safety-pose-estimation/';
    });
  }

  if (window.location.pathname !== '/experience/' && window.location.pathname !== '/experience') return;
  document.body.classList.add('experience-page');

  var headings = allHeadings;
  for (var i = 0; i < headings.length; i++) {
    if ((headings[i].textContent || '').trim().toLowerCase() === 'experience') {
      headings[i].textContent = 'Leadership & Student Support';
      headings[i].classList.add('experience-section-heading');
      var leadershipSection = headings[i].closest('section') || headings[i].parentElement;
      if (leadershipSection) leadershipSection.classList.add('experience-leadership');
      break;
    }
  }

  for (var j = 0; j < headings.length; j++) {
    if ((headings[j].textContent || '').trim().toLowerCase() === 'education') {
      var parent = headings[j].parentElement;
      var current = headings[j];

      while (current && current.parentElement === parent) {
        var next = current.nextElementSibling;
        current.remove();
        current = next;
      }
      break;
    }
  }

  for (var k = 0; k < headings.length; k++) {
    if ((headings[k].textContent || '').trim().toLowerCase() === 'awards') {
      headings[k].classList.add('experience-section-heading');
      var awardsSection = headings[k].closest('section') || headings[k].parentElement;
      if (awardsSection) awardsSection.classList.add('experience-awards');
      break;
    }
  }

  for (var l = 0; l < headings.length; l++) {
    if ((headings[l].textContent || '').trim().toLowerCase() === 'skills & hobbies') {
      headings[l].classList.add('experience-section-heading');
      var skillsSection = headings[l].closest('section') || headings[l].parentElement;
      if (skillsSection) skillsSection.classList.add('experience-skills');
      break;
    }
  }
});
</script>
