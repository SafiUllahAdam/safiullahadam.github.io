bio: |
  I am a Master 2 Research student in Data and Intelligence for Smart
  Systems at Université Claude Bernard Lyon 1, conducting my thesis at the
  LIRIS laboratory (GOAL team) under Prof. Hamida Seba. My research spans
  semi-supervised learning, graph representation learning, edge AI,
  distributed machine learning, NLP, and agentic AI, with a focus on
  multiple models that learn collaboratively under label scarcity.

